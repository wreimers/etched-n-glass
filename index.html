<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Etched N Glass — personalized drinkware, custom etched keepsakes, and illuminated display pieces.">
  <title>Etched N Glass — Luminous Gallery</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/lightbox.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Etched N Glass home">
      <img class="brand-mark" src="favicon.svg" alt="" width="36" height="36">
      <span>Etched N Glass</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Custom glass artistry</p>
        <h1 id="hero-title">Art, captured <em>in glass.</em></h1>
        <p class="lede">Personalized drinkware, custom-etched keepsakes, and illuminated display pieces—crafted one detail at a time.</p>
        <a class="cta" href="#work">View the portfolio</a>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <img src="assets/images/etched-glass-hero.jpg" alt="">
      </div>
    </section>

    <section class="gallery" id="work" aria-labelledby="work-heading">
      <div class="gallery-head">
        <div>
          <p class="section-kicker">Selected work · 01—04</p>
          <h2 id="work-heading">Pieces made personal.</h2>
        </div>
        <div class="filters" role="tablist" aria-label="Portfolio categories">
          <button class="filter active" id="drinkware-tab" type="button" role="tab" aria-selected="true" aria-controls="drinkware-panel" data-gallery-tab="drinkware">Personalized Drinkware</button>
          <button class="filter" id="custom-etching-tab" type="button" role="tab" aria-selected="false" aria-controls="custom-etching-panel" data-gallery-tab="custom-etching" tabindex="-1">Custom Etching</button>
        </div>
      </div>

      <div class="gallery-panel is-active" id="drinkware-panel" role="tabpanel" aria-labelledby="drinkware-tab" data-gallery-panel="drinkware">
        <div class="grid">
          <button class="work" type="button" data-lightbox-item aria-label="View full image of His and Hers Pilsners">
            <img src="assets/images/personalized-pilsner-pair.jpg" alt="A matching pair of personalized etched pilsner glasses">
            <span class="work-copy"><span><small>Personalized Drinkware</small><span class="work-title">His &amp; Hers Pilsners</span><span class="work-description">Matching glasses etched with playful, personalized artwork for two.</span></span><span class="work-number">01</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Viking Beer Mug">
            <img src="assets/images/viking-beer-mug.jpg" alt="A glass beer mug etched with a Viking helmet and crossed axes">
            <span class="work-copy"><span><small>Custom Etching</small><span class="work-title">Viking Beer Mug</span><span class="work-description">A bold Nordic design wrapped around a substantial handled glass.</span></span><span class="work-number">02</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Tribute Tumbler">
            <img src="assets/images/custom-tribute-tumbler.jpg" alt="A custom tribute design etched onto a whiskey tumbler">
            <span class="work-copy"><span><small>One-of-a-Kind Gifts</small><span class="work-title">Tribute Tumbler</span><span class="work-description">Detailed lettering and illustration turn a favorite glass into a personal keepsake.</span></span><span class="work-number">03</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Seahawks Pint Glass">
            <img src="assets/images/seahawks-pint-glass.jpg" alt="Pint glass etched with the Seattle Seahawks logo and lettering">
            <span class="work-copy"><span><small>Personalized Drinkware</small><span class="work-title">Seahawks Pint Glass</span><span class="work-description">Seattle team pride etched in a bold, high-contrast design on a classic pint glass.</span></span><span class="work-number">04</span></span>
          </button>
        </div>
      </div>
      <div class="gallery-panel" id="custom-etching-panel" role="tabpanel" aria-labelledby="custom-etching-tab" data-gallery-panel="custom-etching" hidden>
        <div class="grid">
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Illuminated Glass Display">
            <img src="assets/images/illuminated-glass-display.jpg" alt="Blue illuminated etched glass display reading Etched N Glass">
            <span class="work-copy"><span><small>Illuminated Design</small><span class="work-title">Illuminated Glass Display</span><span class="work-description">Edge lighting brings the etched lettering and decorative details to life in vivid blue.</span></span><span class="work-number">01</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Seahawks Championship Plaque">
            <img src="assets/images/seahawks-glass-plaque.jpg" alt="Freestanding etched Seahawks Super Bowl XLVIII championship plaque">
            <span class="work-copy"><span><small>Commemorative Plaque</small><span class="work-title">Seahawks Championship Plaque</span><span class="work-description">A freestanding etched tribute commemorating Seattle's Super Bowl XLVIII championship.</span></span><span class="work-number">02</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Memorial Mirror">
            <img src="assets/images/memorial-portrait-plaque.jpg" alt="Portrait and memorial inscription etched into an oval glass keepsake">
            <span class="work-copy"><span><small>Memorial Keepsake</small><span class="work-title">Memorial Mirror</span><span class="work-description">A personal inscription preserved in an elegant display piece.</span></span><span class="work-number">03</span></span>
          </button>
          <button class="work" type="button" data-lightbox-item aria-label="View full image of the Purple Memorial Vase">
            <img src="assets/images/purple-memorial-vase.jpg" alt="Purple memorial vase personalized with an etched name and inscription">
            <span class="work-copy"><span><small>Memorial Etching</small><span class="work-title">Purple Memorial Vase</span><span class="work-description">A personalized purple vase etched with a name, dates, and a lasting remembrance.</span></span><span class="work-number">04</span></span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Gallery image viewer">
    <div class="lightbox-panel">
      <button class="lightbox-close" type="button" aria-label="Close image viewer">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="View previous image">‹</button>
      <figure>
        <img class="lightbox-image" src="" alt="">
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="View next image">›</button>
    </div>
  </dialog>
</body>
</html>
