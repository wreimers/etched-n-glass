<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Etched N Glass — personalized drinkware, custom etched keepsakes, and illuminated display pieces.">
  <title>Etched N Glass — Luminous Gallery</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/lightbox.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Etched N Glass home">
      <span class="brand-mark" aria-hidden="true">EN</span>
      <span>Etched N Glass</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Custom glass artistry</p>
        <h1 id="hero-title">Art, captured <em>in glass.</em></h1>
        <p class="lede">Personalized drinkware, custom-etched keepsakes, and illuminated display pieces—crafted one detail at a time.</p>
        <a class="cta" href="#work">View the portfolio</a>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <img src="assets/images/etched-glass-hero.jpg" alt="">
      </div>
    </section>

    <section class="gallery" id="work" aria-labelledby="work-heading">
      <div class="gallery-head">
        <div>
          <p class="section-kicker">Selected work · 01—04</p>
          <h2 id="work-heading">Pieces made personal.</h2>
        </div>
        <div class="filters" aria-label="Portfolio categories">
          <span class="filter active">Personalized Drinkware</span>
          <span class="filter">Custom Etching</span>
        </div>
      </div>

      <div class="grid">
        <button class="work" type="button" data-lightbox-item aria-label="View full image of His and Hers Pilsners">
          <img src="assets/images/personalized-pilsner-pair.jpg" alt="A matching pair of personalized etched pilsner glasses">
          <span class="work-copy"><span><small>Personalized Drinkware</small><span class="work-title">His &amp; Hers Pilsners</span><span class="work-description">Matching glasses etched with playful, personalized artwork for two.</span></span><span class="work-number">01</span></span>
        </button>
        <button class="work" type="button" data-lightbox-item aria-label="View full image of the Viking Beer Mug">
          <img src="assets/images/viking-beer-mug.jpg" alt="A glass beer mug etched with a Viking helmet and crossed axes">
          <span class="work-copy"><span><small>Custom Etching</small><span class="work-title">Viking Beer Mug</span><span class="work-description">A bold Nordic design wrapped around a substantial handled glass.</span></span><span class="work-number">02</span></span>
        </button>
        <button class="work" type="button" data-lightbox-item aria-label="View full image of the Tribute Tumbler">
          <img src="assets/images/custom-tribute-tumbler.jpg" alt="A custom tribute design etched onto a whiskey tumbler">
          <span class="work-copy"><span><small>One-of-a-Kind Gifts</small><span class="work-title">Tribute Tumbler</span><span class="work-description">Detailed lettering and illustration turn a favorite glass into a personal keepsake.</span></span><span class="work-number">03</span></span>
        </button>
        <button class="work" type="button" data-lightbox-item aria-label="View full image of the Dog Silhouette Glass">
          <img src="assets/images/dog-silhouette-glass.jpg" alt="A pint glass etched with a stylized dog silhouette">
          <span class="work-copy"><span><small>Custom Etching</small><span class="work-title">Dog Silhouette Glass</span><span class="work-description">A crisp character portrait etched for a clean, high-contrast finish.</span></span><span class="work-number">04</span></span>
        </button>
      </div>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Gallery image viewer">
    <div class="lightbox-panel">
      <button class="lightbox-close" type="button" aria-label="Close image viewer">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="View previous image">‹</button>
      <figure>
        <img class="lightbox-image" src="" alt="">
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="View next image">›</button>
    </div>
  </dialog>
</body>
</html>
